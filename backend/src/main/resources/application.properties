# Application Name
spring.application.name=espressionist-ecommerce

# Server Configuration
server.port=8080

# Spring Datasource Configuration
spring.datasource.url=jdbc:mariadb://localhost:3306/espressionist_ecommerce
# This is the URL for connecting to the MariaDB database named 'espressionist_ecommerce'
# Ensure that the database is created and accessible before running the application 
spring.datasource.username=espressionist_user
# This is the username for connecting to the MariaDB database
# Ensure that the user has the necessary permissions to access the database
spring.datasource.password=yourpassword
# This is the password for the MariaDB user
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
# This setting limits the maximum number of connections in the pool to 10
spring.datasource.hikari.minimum-idle=5
# This setting ensures that at least 5 connections are always idle and available for use
spring.datasource.hikari.idle-timeout=300000
# This setting defines the maximum time a connection can remain idle before being closed, set to 5 minutes (300000 milliseconds)

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

