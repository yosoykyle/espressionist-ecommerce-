# Server Error Handling
server.error.include-message=always
server.error.include-binding-errors=always

# JPA Auditing Configuration
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Image Upload Configuration
spring.servlet.multipart.max-file-size=10MB
# This setting limits the maximum size of a single uploaded file to 10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
# This setting enables detailed logging of SQL statements executed by Hibernate
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# This setting enables detailed logging of SQL parameter binding in Hibernate
logging.level.com.espressionist_ecommerce=DEBUG

# Jackson Configuration
#Jackson is used for JSON serialization and deserialization
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
#This setting prevents Jackson from failing when it encounters an empty bean during serialization
#It is useful for avoiding serialization errors when dealing with entities that may not have all fields populated
spring.jackson.default-property-inclusion=NON_NULL

